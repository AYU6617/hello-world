<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #e8eaed;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    }
    .card {
      text-align: center;
      padding: 48px 56px;
      border-radius: 16px;
      background: #161a20;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 40px;
      letter-spacing: 1px;
    }
    p {
      margin: 0;
      color: #9aa0a6;
      font-size: 15px;
    }
    button {
      margin-top: 24px;
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #2f6fd8; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">AYU这是我的第一个网页</h1>
    <p>第一个能跑起来的页面 · by dingxin</p>
    <button onclick="document.getElementById('title').textContent = '你好，世界！'">
      点我一下
    </button>
  </div>
</body>
</html>
